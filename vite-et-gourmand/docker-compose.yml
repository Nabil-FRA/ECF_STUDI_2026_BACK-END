# ============================================
# Docker Compose - Vite & Gourmand
# ============================================
# Usage:
#   docker-compose up -d --build    # Démarrer tous les services
#   docker-compose down             # Arrêter tous les services
#   docker-compose logs -f app      # Voir les logs de l'app
# ============================================

services:
  # ============================================
  # APPLICATION PHP (Symfony)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: vg_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini
    networks:
      - vg_network
    depends_on:
      - database
      - mongodb
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_SECRET=${APP_SECRET:-changeme123456789}
      - DATABASE_URL=postgresql://vg_user:vg_password@database:5432/vite_et_gourmand?serverVersion=15&charset=utf8
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=vite_et_gourmand
      - MAILER_DSN=smtp://mailhog:1025

  # ============================================
  # SERVEUR WEB NGINX
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: vg_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vg_network
    depends_on:
      - app

  # ============================================
  # BASE DE DONNÉES POSTGRESQL
  # ============================================
  database:
    image: postgres:15-alpine
    container_name: vg_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vite_et_gourmand
      POSTGRES_USER: vg_user
      POSTGRES_PASSWORD: vg_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vg_network

  # ============================================
  # BASE DE DONNÉES MONGODB
  # ============================================
  mongodb:
    image: mongo:6.0
    container_name: vg_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vite_et_gourmand
    volumes:
      - mongodb_data:/data/db
    networks:
      - vg_network

  # ============================================
  # MAILHOG (Serveur mail de test)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: vg_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web
    networks:
      - vg_network

  # ============================================
  # ADMINER (Interface DB - optionnel)
  # ============================================
  adminer:
    image: adminer:latest
    container_name: vg_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - vg_network
    depends_on:
      - database

# ============================================
# VOLUMES PERSISTANTS
# ============================================
volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local

# ============================================
# RÉSEAU
# ============================================
networks:
  vg_network:
    driver: bridge
