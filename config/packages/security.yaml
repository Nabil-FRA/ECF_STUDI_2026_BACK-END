# config/packages/security.yaml
# ==========================================
# CONFIGURATION SÉCURITÉ
# ==========================================
# L'application est une API pure : un seul firewall, sans état, authentifié
# par token Bearer. Aucune session, aucun formulaire de connexion.
# Le contrôle d'accès est granulaire par rôle.
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # ================================
        # FIREWALL API (UNIQUE)
        # ================================
        # - Stateless : pas de session côté serveur
        # - Authentification par token Bearer
        # - Les routes /api/auth et les GET publics sont accessibles sans token
        # - Couvre toute l'application : il n'existe plus d'autre point d'entrée
        api:
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator
            # Reponse JSON 401 quand une route protegee est atteinte sans
            # utilisateur authentifie, au lieu de la page HTML par defaut.
            entry_point: App\Security\ApiTokenAuthenticator
            # Le contrôle fin est fait dans access_control ci-dessous

    # ================================
    # CONTRÔLE D'ACCÈS
    # ================================
    access_control:
        # Documentation API Swagger
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }

        # Routes API publiques (pas de token requis)
        - { path: ^/api/csrf-token, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/menus, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/themes, roles: PUBLIC_ACCESS }
        - { path: ^/api/regimes, roles: PUBLIC_ACCESS }
        - { path: ^/api/allergenes, roles: PUBLIC_ACCESS }
        - { path: ^/api/avis, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/horaires, roles: PUBLIC_ACCESS }
        - { path: ^/api/contact, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/plats, roles: PUBLIC_ACCESS }

        # Routes API protégées par rôle
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/employe, roles: ROLE_EMPLOYE }
        - { path: ^/api/user, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
